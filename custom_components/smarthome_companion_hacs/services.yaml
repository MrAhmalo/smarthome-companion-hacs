set_sleep_in:
  name: "Set Sleep In"
  description: "Marks one or more blinds for 'Sleep In', preventing them from opening automatically next morning (or today if triggered before 12:00)."
  fields:
    entity_ids:
      name: "Entities"
      description: "List of cover entity IDs (e.g., cover.bedroom) to toggle sleep-in mode for."
      required: true
      selector:
        entity:
          domain: cover
          multiple: true
    active:
      name: "Active"
      description: "Set to True (default) to enable sleep-in, or False to disable."
      required: false
      selector:
        boolean: {}
